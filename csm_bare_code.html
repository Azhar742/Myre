<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Left Menu Example</title>
  <style>
    :root {
      --sidebar-width: 220px;
      --bg: #f6f8fa;
      --sidebar-bg: #222;
      --accent: #2b8cff;
      --text: #e6eef8;
    }
    html,body { height:100%; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:#111; }
    .app {
      display:flex;
      min-height:100vh;
    }

    /* Sidebar */
    nav.sidebar {
      width:var(--sidebar-width);
      background:linear-gradient(180deg,var(--sidebar-bg),#111);
      color:var(--text);
      padding:18px 12px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .brand {
      font-weight:700;
      font-size:1.05rem;
      padding:6px 10px;
      margin-bottom:6px;
      color:var(--text);
    }
    .menu {
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:1;
    }
    .menu button {
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      background:transparent;
      color:inherit;
      border:0;
      padding:10px;
      text-align:left;
      border-radius:8px;
      cursor:pointer;
      font-size:0.95rem;
    }
    .menu button:hover { background:rgba(255,255,255,0.03); }
    .menu button.active {
      background:linear-gradient(90deg, rgba(43,140,255,0.14), rgba(43,140,255,0.06));
      box-shadow:0 1px 0 rgba(255,255,255,0.02) inset;
      border-left:4px solid var(--accent);
      padding-left:8px;
    }
    .menu button .kbd {
      margin-left:auto;
      opacity:0.6;
      font-size:0.8rem;
    }

    /* Content */
    main.content {
      flex:1;
      padding:28px;
      box-sizing:border-box;
    }
    .panel { display:none; }
    .panel.active { display:block; }

    /* Responsive: collapse sidebar on small screens */
    @media (max-width:640px) {
      nav.sidebar {
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        transform:translateX(-100%);
        transition:transform .22s ease;
        z-index:30;
      }
      nav.sidebar.open { transform:translateX(0); }
      .hamburger {
        display:inline-flex;
        gap:8px;
        align-items:center;
        padding:8px 12px;
        border-radius:8px;
        background:#fff;
        cursor:pointer;
        box-shadow:0 1px 4px rgba(0,0,0,0.08);
      }
      main.content { padding:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" role="navigation" aria-label="Main menu">
      <div class="brand">My App</div>

      <ul class="menu" role="menu" id="menu">
        <li role="none">
          <button role="menuitem" data-target="home" class="active" aria-current="page">
            Home
            <span class="kbd">⌘1</span>
          </button>
        </li>
        <li role="none">
          <button role="menuitem" data-target="account">Account Management <span class="kbd">⌘2</span></button>
        </li>
        <li role="none">
          <button role="menuitem" data-target="settings">Account Setting <span class="kbd">⌘3</span></button>
        </li>
      </ul>

      <div style="font-size:0.85rem; opacity:0.85; padding-top:6px;">v1.0</div>
    </nav>

    <main class="content" id="main">
      <div style="display:flex; gap:12px; align-items:center; margin-bottom:18px;">
        <div class="hamburger" id="hamburger" style="display:none;">☰ Menu</div>
        <h1 id="title" style="margin:0; font-size:1.25rem;">Home</h1>
      </div>

      <section id="home" class="panel active">
        <h2>Welcome</h2>
        <p>This is the home page content.</p>
      </section>

      <section id="account" class="panel" aria-hidden="true">
        <h2>Account Management</h2>
        <p>Manage users, roles, and permissions here.</p>
      </section>

      <section id="settings" class="panel" aria-hidden="true">
        <h2>Account Setting</h2>
        <p>Change your profile, password, and preferences.</p>
      </section>
    </main>
  </div>

  <script>
    // Basic navigation logic
    const menu = document.getElementById('menu');
    const buttons = menu.querySelectorAll('button[data-target]');
    const panels = document.querySelectorAll('.panel');
    const title = document.getElementById('title');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // set active button
        buttons.forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
        btn.classList.add('active');
        btn.setAttribute('aria-current','page');

        // show panel
        const target = btn.dataset.target;
        panels.forEach(p => {
          if (p.id === target) {
            p.classList.add('active');
            p.removeAttribute('aria-hidden');
            title.textContent = btn.textContent.trim();
          } else {
            p.classList.remove('active');
            p.setAttribute('aria-hidden','true');
          }
        });

        // close sidebar on mobile
        document.querySelector('nav.sidebar')?.classList.remove('open');
      });
    });

    // Optional: keyboard shortcuts (Cmd/Ctrl + 1/2/3)
    window.addEventListener('keydown', (e) => {
      const isCmd = e.metaKey || e.ctrlKey;
      if (!isCmd) return;
      if (e.key === '1') buttons[0].click();
      if (e.key === '2') buttons[1].click();
      if (e.key === '3') buttons[2].click();
    });

    // Mobile hamburger toggle
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.querySelector('nav.sidebar');
    function updateMobileUI() {
      if (window.innerWidth <= 640) {
        hamburger.style.display = 'inline-flex';
      } else {
        hamburger.style.display = 'none';
        sidebar.classList.remove('open');
      }
    }
    updateMobileUI();
    window.addEventListener('resize', updateMobileUI);
    hamburger.addEventListener('click', () => sidebar.classList.toggle('open'));

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
      if (window.innerWidth > 640) return;
      if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });
  </script>
</body>
</html>
