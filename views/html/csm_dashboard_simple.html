<!DOCTYPE html>
<html>
<head>
    <title>CSM Dashboard</title>
    <link rel="stylesheet" href="/static/css/apple_theme.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #333;
            margin: 0 0 20px 0;
        }
        .user-id {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        .label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logout-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #c53030;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSM Dashboard</h1>
        <div class="label">User ID</div>
        <div class="user-id">{{ user_id }}</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <script>
        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('/');
        }
    </script>
</body>
</html>
